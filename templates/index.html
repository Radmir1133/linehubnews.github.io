<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LineHub News</title>
    <link rel="stylesheet" href="{{ url_for ('static', filename='style.css')}}">
</head>
<body>
    <header>
        <a class="http" href="{{ url_for('index') }}"><h1>LineHub <span class="spanNews">News</span></h1></a>
    </header>

    <h3 class="text_day">{{ ylala }}</h3>
    {% for news in all_news %}
    <article class="news">
        <div class="textnewsmain">
            <a class="http" href="{{ url_for('currentNews', news_id=news.id) }}">

                <h2>{{ news.name }}</h2>
                <p class="textp">{{news.info}}</p>
                <p class="dop">Нажмите для подробностей</p>
                <p class="textdata"><time>{{news.data}}</time></p>

            </a>
        </div>
    </article>
    {% endfor %}
</body>
</html>
